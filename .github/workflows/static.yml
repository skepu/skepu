name: Deploy Visualizer to Pages

on:
  push:
    branches:
      - gh-pages

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Copy the SkePU library headers into the visualizer
        run: make -C visualizer skepu-lib

      - name: Stage visualizer for deploy
        run: |
          mkdir -p _stage/visualizer
          cp -r visualizer/. _stage/visualizer/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_stage

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
