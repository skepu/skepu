project:
  type: book
  pre-render:
    - scripts/build_listings.py
  post-render:
    - scripts/install_viz.py

book:
  title: "SkePU User Guide"
  author:
    - "August Ernstsson"
    - "Johan Ahlqvist"
    - "Christoph Kessler"
    - "David Berntsson"
  chapters:
    - index.qmd
    - src/installation.qmd
    - src/architecture.qmd
    - src/documentation.qmd
    - src/stdlib.qmd
    - src/skevu.qmd
    - src/lsp.qmd
    - src/blas.qmd
    - src/changelog.qmd
    - src/acknowledgements.qmd

filters:
  - skevu

bibliography: bibliography.bib
csl: ieee.csl
reference-section-title: References

format:
  html:
    theme: [cosmo, theme.scss]
    toc: true
    toc-depth: 4
    code-line-numbers: true
    css: custom.css
    resources:
      - "demos/"
      - "listings/wasm/"
    grid:
      sidebar-width: 230px
      body-width: 880px
      margin-width: 210px
