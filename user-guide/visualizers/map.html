
<div class="viz-wrap">
  <div class="controls">
    <label><span>Rows</span><input type="number" id="vmap-rows"      value="4" min="1" max="12"></label>
    <label><span>Cols</span><input type="number" id="vmap-cols"      value="6" min="1" max="12"></label>
    <label><span>Inputs</span><input type="number" id="vmap-numInputs" value="2" min="1" max="4"></label>
  </div>

  <div class="viz-section">
    <button class="viz-section-bar">
      <span class="viz-section-title">Map</span>
      <span class="viz-chevron">▾</span>
    </button>
    <div class="viz-section-body">
      <p class="desc" id="vmap-desc"></p>
      <div id="vmap-area"></div>
      <div class="legend" id="vmap-legend"></div>
    </div>
  </div>

  <div class="viz-section">
    <button class="viz-section-bar">
      <span class="viz-section-title">Source</span>
      <span class="viz-chevron viz-chevron-collapsed">▾</span>
    </button>
    <div class="viz-section-body" id="vmap-code" style="display:none"></div>
  </div>
</div>
<script>VizUtils.mountStandaloneViz("map", "vmap");</script>
