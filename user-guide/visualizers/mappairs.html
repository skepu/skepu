
<div class="viz-wrap">
  <div class="controls">
    <label><span>Rows</span><input type="number" id="vmp-rows"   value="4" min="1" max="12"></label>
    <label><span>Cols</span><input type="number" id="vmp-cols"   value="5" min="1" max="12"></label>
    <label><span>Vert inputs</span><input type="number" id="vmp-nvert"  value="1" min="1" max="3"></label>
    <label><span>Horiz inputs</span><input type="number" id="vmp-nhoriz" value="1" min="1" max="3"></label>
  </div>

  <div class="viz-section">
    <button class="viz-section-bar">
      <span class="viz-section-title">MapPairs</span>
      <span class="viz-chevron">▾</span>
    </button>
    <div class="viz-section-body">
      <p class="desc" id="vmp-desc"></p>
      <div id="vmp-area"></div>
      <div class="legend" id="vmp-legend"></div>
    </div>
  </div>

  <div class="viz-section">
    <button class="viz-section-bar">
      <span class="viz-section-title">Source</span>
      <span class="viz-chevron viz-chevron-collapsed">▾</span>
    </button>
    <div class="viz-section-body" id="vmp-code" style="display:none"></div>
  </div>
</div>
<script>VizUtils.mountStandaloneViz("mappairs", "vmp");</script>
