
<div class="viz-wrap">
  <div class="controls">
    <label><span>Rows</span><input type="number" id="vmpr-rows"   value="4" min="1" max="12"></label>
    <label><span>Cols</span><input type="number" id="vmpr-cols"   value="5" min="1" max="12"></label>
    <label><span>Vert inputs</span><input type="number" id="vmpr-nvert"  value="1" min="1" max="3"></label>
    <label><span>Horiz inputs</span><input type="number" id="vmpr-nhoriz" value="1" min="1" max="3"></label>
    <label><span>Mode</span>
      <select id="vmpr-mode">
        <option value="row">Row-wise</option>
        <option value="col">Col-wise</option>
      </select>
    </label>
  </div>

  <div class="viz-section">
    <button class="viz-section-bar">
      <span class="viz-section-title">MapPairsReduce</span>
      <span class="viz-chevron">▾</span>
    </button>
    <div class="viz-section-body">
      <p class="desc" id="vmpr-desc"></p>
      <div id="vmpr-area"></div>
      <div class="legend" id="vmpr-legend"></div>
    </div>
  </div>

  <div class="viz-section">
    <button class="viz-section-bar">
      <span class="viz-section-title">Source</span>
      <span class="viz-chevron viz-chevron-collapsed">▾</span>
    </button>
    <div class="viz-section-body" id="vmpr-code" style="display:none"></div>
  </div>
</div>
<script>VizUtils.mountStandaloneViz("mappairsreduce", "vmpr");</script>
