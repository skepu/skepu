
<div class="viz-wrap">
  <div class="controls">
    <label><span>Rows</span><input type="number" id="vred-rows" value="4" min="1" max="12"></label>
    <label><span>Cols</span><input type="number" id="vred-cols" value="6" min="1" max="12"></label>
    <label><span>Mode</span>
      <select id="vred-mode">
        <option value="reduce_full">Full</option>
        <option value="reduce_row">Row-wise</option>
        <option value="reduce_col">Col-wise</option>
        <option value="reduce_2op">2-operator</option>
      </select>
    </label>
  </div>

  <div class="viz-section">
    <button class="viz-section-bar">
      <span class="viz-section-title" id="vred-section-title">Reduce</span>
      <span class="viz-chevron">▾</span>
    </button>
    <div class="viz-section-body">
      <p class="desc" id="vred-desc"></p>
      <div id="vred-area"></div>
      <div class="legend" id="vred-legend"></div>
    </div>
  </div>

  <div class="viz-section">
    <button class="viz-section-bar">
      <span class="viz-section-title">Source</span>
      <span class="viz-chevron viz-chevron-collapsed">▾</span>
    </button>
    <div class="viz-section-body" id="vred-code" style="display:none"></div>
  </div>
</div>
<script>VizUtils.mountGroupViz("vred");</script>
